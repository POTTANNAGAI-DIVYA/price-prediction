
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #234e70;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 6px;
            text-align: center;
            color: #166534;
        }

        .error {
            margin-top: 20px;
            color: #b91c1c;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Student Performance Prediction</h1>

    <form action="/predict" method="POST">

        <label for="hours">Hours Studied (0–8)</label>
        <input type="number" id="hours" name="Hours_Studied"
               min="0" max="8" step="1" required>

        <label for="attendance">Attendance Percentage (50–100)</label>
        <input type="number" id="attendance" name="Attendance_Percent"
               min="50" max="100" step="1" required>

        <label for="previous">Previous Score (30–100)</label>
        <input type="number" id="previous" name="Previous_Score"
               min="30" max="100" step="1" required>

        <label for="assignments">Assignments Completed (0–10)</label>
        <input type="number" id="assignments" name="Assignments_Completed"
               min="0" max="10" step="1" required>

        <label for="sleep">Sleep Hours (4–10)</label>
        <input type="number" id="sleep" name="Sleep_Hours"
               min="4" max="10" step="0.1" required>

        <label for="activities">Extracurricular Activities</label>
        <select id="activities" name="Extracurricular_Activities_up" required>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <button type="submit">Predict Performance</button>
    </form>

    {% if prediction is not none %}
        <div class="result">
            <h2>Predicted Performance Score</h2>
            <h1>{{ prediction }} / 100</h1>
        </div>
    {% endif %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

</div>
</body>
</html>
